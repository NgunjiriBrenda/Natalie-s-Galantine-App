<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galantine Surprise!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  
    .flower {
      position: absolute;
      animation: floatUp linear infinite;
      user-select: none;
      pointer-events: none;
      font-size: 1.5rem;
    }
    
    @media (min-width: 640px) {
      .flower {
        font-size: 2rem;
      }
    }
    
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      30% { opacity: 0.8; }
      100% { transform: translateY(-120vh) scale(1.6); opacity: 0; }
    }

    .zoom-in {
      animation: zoomIn 1.5s ease-out forwards;
    }

    @keyframes zoomIn {
      0% { 
        transform: scale(0);
        opacity: 0;
      }
      50% {
        opacity: 0.5;
      }
      100% { 
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-500 via-pink-200 to-pink-300 flex flex-col items-center justify-center min-h-screen overflow-hidden relative px-4 sm:px-0 py-8">

  <!-- Floating flowers container -->
  <div id="flowersContainer"></div>

  <img 
    src="/galantine-app/her.jpeg"
    alt="Her Picture"
    class="zoom-in w-48 h-48 sm:w-64 sm:h-64 md:w-72 md:h-72 mx-auto rounded-3xl object-cover 
           shadow-[0_20px_40px_rgba(147,51,234,0.3)] sm:shadow-[0_25px_50px_rgba(147,51,234,0.35)] mb-6 sm:mb-8"
  />

  <div class="bg-pink-400 p-4 sm:p-6 rounded-3xl shadow-2xl text-center w-11/12 sm:w-9/12 max-w-md relative z-10 mb-6">
    <h1 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-white mt-1 sm:mt-2">Hey Nicole ❤️💋</h1>

    <p class="mt-3 sm:mt-2 text-white text-sm sm:text-base md:text-lg font-serif mx-auto max-w-[250px] sm:max-w-[250px] leading-snug sm:leading-tight px-2 sm:px-0">
      My Hotee Hotee bestfriend 🫶💕 Click the button below !
    </p>
  </div>

  <a 
     href="./appreciation.html"
     class="inline-block px-8 py-3 sm:px-10 sm:py-4 rounded-full text-base sm:text-lg font-medium shadow-xl 
     bg-pink-400 text-white
     hover:bg-gradient-to-r hover:from-pink-100
     hover:text-white
     hover:scale-105 active:scale-95 transition-all duration-500"
  >
    Let's go 💌 🎉
  </a> 

  <script src="./index.js"></script>
</body>
</html>
