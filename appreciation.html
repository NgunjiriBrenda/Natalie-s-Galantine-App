<style>
/* Background gradient animation - PINK THEME */
body.animate-bg {
    background: linear-gradient(120deg, #fecdd3, #fda4af, #fb7185, #f472b6, #ec4899);
    background-size: 400% 400%;
    animation: bgShift 12s ease infinite;
}
@keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Fade in animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fadeIn { animation: fadeIn 1.3s ease forwards; }

/* Glowing button effect */
.glow-button {
    animation: glow 2s ease-in-out infinite;
}
@keyframes glow {
    0%, 100% { box-shadow: 0 0 20px rgba(236, 72, 153, 0.5); }
    50% { box-shadow: 0 0 30px rgba(236, 72, 153, 0.8), 0 0 40px rgba(236, 72, 153, 0.6); }
}

/* Flip Card Styles */
.flip-card {
    perspective: 1000px;
    cursor: pointer;
}

.flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
}

.flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
}

.flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.flip-card-back {
    transform: rotateY(180deg);
}

/* Quote carousel animation */
@keyframes slideIn {
    from { opacity: 0; transform: translateX(50px); }
    to { opacity: 1; transform: translateX(0); }
}

.quote-text {
    animation: slideIn 0.8s ease;
}

.dot.active {
    background-color: #ec4899;
    transform: scale(1.3);
}

/* Floating hearts */
.hearts span {
    position: absolute;
    bottom: -30px;
    font-size: 18px;
    animation: floatUpRotate 8s linear infinite;
    opacity: 0.7;
}

@media (min-width: 640px) {
    .hearts span {
        font-size: 24px;
    }
}

@keyframes floatUpRotate {
    0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
    30% { opacity: 0.8; }
    100% { transform: translateY(-120vh) rotate(360deg) scale(1.4); opacity: 0; }
}

/* Floating stars */
.stars span {
    position: absolute;
    bottom: -30px;
    font-size: 16px;
    animation: starFloat 9s linear infinite;
    opacity: 0.75;
}

@media (min-width: 640px) {
    .stars span {
        font-size: 20px;
    }
}

@keyframes starFloat {
    0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
    30% { opacity: 0.9; }
    100% { transform: translateY(-120vh) rotate(-360deg) scale(1.5); opacity: 0; }
}

/* Floating sparkles */
.sparkles span {
    position: absolute;
    font-size: 8px;
    color: #fffacd;
    opacity: 0.8;
    animation: sparkleFloat 5s linear infinite;
}

@media (min-width: 640px) {
    .sparkles span {
        font-size: 10px;
    }
}

@keyframes sparkleFloat {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    50% { opacity: 0.9; }
    100% { transform: translateY(-100vh) scale(1); opacity: 0; }
}
</style>
